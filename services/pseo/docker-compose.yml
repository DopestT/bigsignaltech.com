services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-pseo-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - pseo-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://bigsignaltech.com}
      PSEO_PATH_PREFIX: ${PSEO_PATH_PREFIX:-/tools}
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      EDGE_INGEST_URL: ${EDGE_INGEST_URL:-}
      EDGE_INGEST_API_KEY: ${EDGE_INGEST_API_KEY:-}
      INDEXNOW_HOST: ${INDEXNOW_HOST:-bigsignaltech.com}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDEXNOW_KEY_LOCATION: ${INDEXNOW_KEY_LOCATION:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - pseo-net

volumes:
  postgres_data:

networks:
  pseo-net:
    driver: bridge
